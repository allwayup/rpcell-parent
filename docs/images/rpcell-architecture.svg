<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">RPCell 总体架构图</title>
  <desc id="desc">展示 Spring Boot 自动装配、消费者代理与过滤器、集群容错、注册发现、Netty 传输、提供者执行链, 以及 RPCell 协议帧结构. </desc>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bootGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .panel-title { font-size: 24px; font-weight: 700; }
      .box-title { font-size: 18px; font-weight: 700; fill: #172033; }
      .box-sub { font-size: 14px; fill: #526078; }
      .small { font-size: 13px; fill: #64748b; }
      .step { font-size: 15px; font-weight: 600; fill: #273653; }
      .consumer-box { fill: #ffffff; stroke: #bfdbfe; stroke-width: 1.5; }
      .provider-box { fill: #ffffff; stroke: #bbf7d0; stroke-width: 1.5; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .flow-green { fill: none; stroke: #059669; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .registry-line { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="72" fill="url(#headerGradient)"/>
  <text x="48" y="45" font-size="30" font-weight="700" fill="#ffffff">RPCell 总体架构</text>
  <text x="330" y="43" font-size="16" fill="#cbd5e1">注解驱动 · Spring Boot 自动装配 · Netty TCP · MessagePack</text>
  <text x="1548" y="42" text-anchor="end" font-size="15" fill="#93c5fd">Java 17 / Spring Boot 3</text>

  <!-- Spring Boot lifecycle -->
  <rect x="48" y="96" width="1504" height="116" rx="16" fill="url(#bootGradient)" stroke="#c7d2fe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="76" y="130" class="panel-title" fill="#3730a3">Spring Boot 启动与生命周期</text>
  <text x="76" y="157" class="box-sub">RpcellAutoConfiguration</text>
  <text x="76" y="181" class="small">BeanPostProcessor + ContextRefreshedEvent + DisposableBean</text>

  <rect x="430" y="119" width="190" height="64" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="525" y="145" text-anchor="middle" class="step">扫描接口与字段</text>
  <text x="525" y="168" text-anchor="middle" class="small">@RpcService / @RpcReference</text>
  <path d="M 628 151 H 658" class="flow-blue"/>

  <rect x="668" y="119" width="190" height="64" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="763" y="145" text-anchor="middle" class="step">初始化运行组件</text>
  <text x="763" y="168" text-anchor="middle" class="small">SPI / Client / Server</text>
  <path d="M 866 151 H 896" class="flow-blue"/>

  <rect x="906" y="119" width="190" height="64" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="1001" y="145" text-anchor="middle" class="step">注册、订阅、注入</text>
  <text x="1001" y="168" text-anchor="middle" class="small">Export / Subscribe / Proxy</text>
  <path d="M 1104 151 H 1134" class="flow-blue"/>

  <rect x="1144" y="119" width="190" height="64" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="1239" y="145" text-anchor="middle" class="step">关闭时回收资源</text>
  <text x="1239" y="168" text-anchor="middle" class="small">Unregister / Shutdown</text>
  <rect x="1370" y="119" width="150" height="64" rx="10" fill="#312e81"/>
  <text x="1445" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">统一配置</text>
  <text x="1445" y="168" text-anchor="middle" font-size="13" fill="#ddd6fe">rpcell.*</text>

  <!-- Main panels -->
  <rect x="48" y="240" width="500" height="594" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1052" y="240" width="500" height="594" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="76" y="278" class="panel-title" fill="#1d4ed8">Consumer 消费者</text>
  <text x="76" y="302" class="box-sub">业务调用 → 代理 → 容错与路由 → 网络客户端</text>
  <text x="1080" y="278" class="panel-title" fill="#047857">Provider 提供者</text>
  <text x="1080" y="302" class="box-sub">网络服务端 → 过滤器 → 服务执行 → Spring Bean</text>

  <!-- Consumer chain -->
  <rect x="82" y="326" width="432" height="58" rx="10" class="consumer-box"/>
  <text x="106" y="351" class="box-title">业务 Bean · @RpcReference</text>
  <text x="106" y="373" class="box-sub">接口字段注入, 声明 group / version / timeout / retries</text>
  <path d="M 298 384 V 400" class="flow-blue"/>

  <rect x="82" y="406" width="432" height="58" rx="10" class="consumer-box"/>
  <text x="106" y="431" class="box-title">JDK 动态代理 · CallMetadata</text>
  <text x="106" y="453" class="box-sub">RpcProxyFactory 构造 Invocation 与调用附件</text>
  <path d="M 298 464 V 480" class="flow-blue"/>

  <rect x="82" y="486" width="432" height="58" rx="10" class="consumer-box"/>
  <text x="106" y="511" class="box-title">Consumer FilterChain</text>
  <text x="106" y="533" class="box-sub">按配置加载自定义 Filter, 可传播 Seata XID</text>
  <path d="M 298 544 V 560" class="flow-blue"/>

  <rect x="82" y="566" width="432" height="58" rx="10" class="consumer-box"/>
  <text x="106" y="591" class="box-title">FailoverCluster · RandomLoadBalance</text>
  <text x="106" y="613" class="box-sub">选择可用节点, 仅对传输与超时类故障进行重试</text>
  <path d="M 298 624 V 640" class="flow-blue"/>

  <rect x="82" y="646" width="432" height="58" rx="10" class="consumer-box"/>
  <text x="106" y="671" class="box-title">RegistryDirectory · ClientInvoker</text>
  <text x="106" y="693" class="box-sub">维护服务地址快照, 按服务键筛选并发起调用</text>
  <path d="M 298 704 V 720" class="flow-blue"/>

  <rect x="82" y="726" width="432" height="74" rx="10" fill="#1d4ed8"/>
  <text x="106" y="755" font-size="19" font-weight="700" fill="#ffffff">RpcNettyClient</text>
  <text x="106" y="781" font-size="14" fill="#dbeafe">连接管理 · requestId 关联 · 单次调用超时控制</text>

  <!-- Provider chain -->
  <rect x="1086" y="726" width="432" height="74" rx="10" fill="#047857"/>
  <text x="1110" y="755" font-size="19" font-weight="700" fill="#ffffff">RpcNettyServer</text>
  <text x="1110" y="781" font-size="14" fill="#d1fae5">帧解码 · 请求分发 · 响应编码</text>
  <path d="M 1302 726 V 710" class="flow-green"/>

  <rect x="1086" y="646" width="432" height="58" rx="10" class="provider-box"/>
  <text x="1110" y="671" class="box-title">Provider FilterChain</text>
  <text x="1110" y="693" class="box-sub">全局与服务级 Filter, 绑定并清理事务上下文</text>
  <path d="M 1302 646 V 630" class="flow-green"/>

  <rect x="1086" y="566" width="432" height="58" rx="10" class="provider-box"/>
  <text x="1110" y="591" class="box-title">RpcServerExecutor</text>
  <text x="1110" y="613" class="box-sub">按 interface + group + version 定位服务并反射调用</text>
  <path d="M 1302 566 V 550" class="flow-green"/>

  <rect x="1086" y="486" width="432" height="58" rx="10" class="provider-box"/>
  <text x="1110" y="511" class="box-title">ServiceDescriptor</text>
  <text x="1110" y="533" class="box-sub">保存服务元数据与可暴露方法, 执行 include / exclude</text>
  <path d="M 1302 486 V 470" class="flow-green"/>

  <rect x="1086" y="406" width="432" height="58" rx="10" class="provider-box"/>
  <text x="1110" y="431" class="box-title">Spring 实现 Bean</text>
  <text x="1110" y="453" class="box-sub">实现标注 @RpcService 的接口, 由容器管理业务逻辑</text>

  <rect x="1086" y="326" width="432" height="58" rx="10" fill="#d1fae5" stroke="#86efac"/>
  <text x="1110" y="351" class="box-title">服务导出与地址注册</text>
  <text x="1110" y="373" class="box-sub">生成 rpcell://host:port 服务 URL, 支持 Nacos 动态发现</text>

  <!-- Center: registry -->
  <rect x="600" y="240" width="400" height="194" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="278" text-anchor="middle" class="panel-title" fill="#6d28d9">注册与服务发现</text>
  <text x="800" y="302" text-anchor="middle" class="box-sub">Provider 注册地址, Consumer 订阅并接收列表通知</text>
  <rect x="626" y="326" width="162" height="76" rx="11" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="707" y="355" text-anchor="middle" class="box-title">Nacos</text>
  <text x="707" y="380" text-anchor="middle" class="box-sub">namespace / group</text>
  <rect x="812" y="326" width="162" height="76" rx="11" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="893" y="355" text-anchor="middle" class="box-title">Direct</text>
  <text x="893" y="380" text-anchor="middle" class="box-sub">静态 host:port 列表</text>

  <path d="M 514 675 H 574 V 364 H 614" class="registry-line"/>
  <text x="557" y="521" text-anchor="middle" class="small" transform="rotate(-90 557 521)">subscribe / notify</text>
  <path d="M 1086 355 H 1024 V 337 H 988" class="registry-line"/>
  <text x="1036" y="323" text-anchor="middle" class="small">register</text>

  <!-- Center: shared core -->
  <rect x="600" y="462" width="400" height="156" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="498" text-anchor="middle" class="panel-title" fill="#b45309">共享核心能力</text>
  <text x="800" y="530" text-anchor="middle" class="box-title">API · SPI · Serializer · Codec</text>
  <text x="800" y="557" text-anchor="middle" class="box-sub">Invocation / Result / URL / ServiceDescriptor</text>
  <text x="800" y="582" text-anchor="middle" class="box-sub">ExtensionLoader / MessagePack / RpcCellProtocol</text>
  <text x="800" y="604" text-anchor="middle" class="small">贯穿消费者、提供者与注册中心的公共模型</text>

  <!-- Network -->
  <rect x="600" y="656" width="400" height="178" rx="18" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="690" text-anchor="middle" class="panel-title" fill="#0369a1">Netty TCP 传输层</text>
  <text x="800" y="716" text-anchor="middle" class="box-sub">长度域拆包 · 最大帧 8 MiB · 同步请求响应</text>
  <rect x="630" y="738" width="340" height="34" rx="8" fill="#e0f2fe"/>
  <text x="800" y="761" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">RPCellProtocol + MessagePack</text>
  <text x="800" y="805" text-anchor="middle" class="small">请求类型 1 / 响应类型 2 / requestId 8 字节</text>

  <!-- Request and response -->
  <path d="M 514 763 H 588" class="flow-blue"/>
  <path d="M 1012 763 H 1074" class="flow-blue"/>
  <text x="800" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">请求 Invocation →</text>
  <path d="M 1074 816 H 1012" class="flow-green"/>
  <path d="M 588 816 H 526" class="flow-green"/>
  <text x="800" y="824" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">← 响应 Result</text>

  <!-- Protocol frame -->
  <rect x="48" y="868" width="1504" height="166" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="76" y="906" class="panel-title" fill="#334155">RPCell 二进制协议帧</text>
  <text x="390" y="905" class="box-sub">固定头部 14 字节, 字段使用大端字节序；总长度包含头部与 Body</text>

  <rect x="76" y="930" width="220" height="64" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="186" y="957" text-anchor="middle" class="box-title">Total Length</text>
  <text x="186" y="981" text-anchor="middle" class="box-sub">4 bytes</text>
  <rect x="306" y="930" width="190" height="64" rx="9" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="401" y="957" text-anchor="middle" class="box-title">Serialization ID</text>
  <text x="401" y="981" text-anchor="middle" class="box-sub">1 byte · MessagePack 0x01</text>
  <rect x="506" y="930" width="180" height="64" rx="9" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="596" y="957" text-anchor="middle" class="box-title">Message Type</text>
  <text x="596" y="981" text-anchor="middle" class="box-sub">1 byte · Request / Response</text>
  <rect x="696" y="930" width="210" height="64" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="801" y="957" text-anchor="middle" class="box-title">Request ID</text>
  <text x="801" y="981" text-anchor="middle" class="box-sub">8 bytes · 请求响应关联</text>
  <rect x="916" y="930" width="608" height="64" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1220" y="957" text-anchor="middle" class="box-title">Body</text>
  <text x="1220" y="981" text-anchor="middle" class="box-sub">序列化后的 Invocation 或 Result</text>

  <text x="48" y="1062" class="small">实线: 调用与执行流程</text>
  <line x1="205" y1="1057" x2="245" y2="1057" stroke="#2563eb" stroke-width="2.5"/>
  <text x="278" y="1062" class="small">虚线: 注册与订阅流程</text>
  <line x1="445" y1="1057" x2="485" y2="1057" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1548" y="1062" text-anchor="end" class="small">当前可运行实现: Direct / Nacos · Random / Failover · MessagePack</text>
</svg>
